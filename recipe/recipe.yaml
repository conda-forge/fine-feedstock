context:
  version: "2.7.1"
  python_min: "3.10"
  python_max: "3.14.3"

package:
  name: fine
  version: ${{ version }}

source:
  url: https://github.com/FZJ-IEK3-VSA/FINE/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ace45eca13912b5e1c9beba960e9b0ff4b0ffef1452c555c95fef1ddd532af1f

build:
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<=${{ python_max }}
    - pip
    - geopandas >=1.0.0,<=1.1.4
    - glpk >=4.63,<=5.0
    - openpyxl <=3.1.5
    - matplotlib <=3.11.1
    - xlrd >=1.2.0,<=2.0.2
    - pyomo >=6.8.1,<=6.10.1
    - numpy >=1.22,<=2.4.6
    - pandas >=2.2.0,<3.0.0
    - scipy >=1.7.2,<=1.17.1
    - scikit-learn >=1.3.0,<=1.9.0
    - xarray >=2023.4.1,<=2026.7.0,!=2024.10.0,!=2024.11.0,!=2025.1,!=2025.3,!=2025.9
    - rasterio >=1.3.7,<=1.5.0
    - netcdf4 >1.6.4,<=1.7.4
    - tsam >=3.4.2,<=3.4.2
    - pwlf >=2.5.0,<=2.6.0
    - psutil >=5.8.0,<=7.2.2
    - gurobi-logtools >=3.2.0,<=4.0.1
    - highspy >=1.13.1, <=1.14.0
    - ipykernel <=7.2.0

tests:
  - script:
      - pytest -n auto -vvv
    requirements:
      run:
        - pytest
        - pytest-xdist
        - python ${{ python_min }}.*
    files:
      source:
        - .
about:
  homepage: https://github.com/FZJ-IEK3-VSA/FINE
  summary: The FINE python package provides a framework for modeling, optimizing and assessing energy systems.
  license: "MIT"
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - phil-fzj
    - JohannesBehrens
    - julian-belina
