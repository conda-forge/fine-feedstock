{% set python_min = "3.10" %}
{% set python_max = "3.13" %}
{% set version = "2.6.0" %}


package:
  name: fine
  version: {{ version }}

source:
  url: https://github.com/FZJ-IEK3-VSA/FINE/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e3d2c03c1fb0e50a34e36d44f63147009e215e97b201563ce6bef840acae2b3f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77.0.0
  run:
    - python >={{ python_min }},<={{ python_max }}
    - pip
    - geopandas >=0.12.0,<=0.14.4,!=0.13.0
    - glpk >=4.63,<=5.0
    - openpyxl <=3.1.5
    - matplotlib <=3.9.2
    - xlrd >=1.2.0,<=2.0.2
    - pyomo >=6.8,<=6.9.4
    - numpy >=1.22,<=2.3.3
    - pandas >=1.4,<=2.2.3
    - scipy >=1.7.2,<=1.16.2
    - scikit-learn >=1.2,<=1.7.2
    - xarray >=2022.3.0,<=2025.10.1,!=2024.10.0,!=2024.11.0,!=2025.1.*,!=2025.3.*,!=2025.9.*
    - rasterio >=1.3.0,<=1.4.3,!=1.3.0.post1
    - netcdf4 >1.5.8,<=1.7.3
    - tsam >=2.0.1,<=2.3.9
    - pwlf >=2.0.4,<=2.5.1
    - psutil >=5.8.0,<=7.1.0
    - gurobi-logtools >=3.0.0,<=3.2.0
    - ipykernel <=6.29.5

test:
  imports:
    - fine
    - pandas
    - numpy
  source_files:
    - .
  requires:
    - python {{ python_min }}
    - pytest <=8.3.3
  commands:
    - pytest test/

about:
  home: https://github.com/FZJ-IEK3-VSA/FINE.git
  summary: The FINE python package provides a framework for modeling, optimizing and assessing energy systems.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - noah80
    - t-gross
    - julian-belina
    - JohannesBehrens
